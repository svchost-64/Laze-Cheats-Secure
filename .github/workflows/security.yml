name: Security gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:output
      - name: Check syntax
        run: |
          find api js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check yape-pago.js
      - name: File integrity
        run: sha256sum --check security/manifest.sha256
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
