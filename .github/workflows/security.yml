name: Security gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Check syntax
        run: |
          find api js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check yape-pago.js
      - name: Static file integrity baseline
        run: sha256sum --check security/manifest.sha256
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
